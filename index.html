<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>0.16</title>
<style>
:root{
  --bg:#16120f; --panel:#241d18; --panel2:#312721; --gold:#d9b56d; --gold2:#f4deb0;
  --text:#f8f2e9; --muted:#cbbda9; --ok:#7bc48c; --danger:#de7a6b; --accent:#a9d2ff;
  --cell:58px; --shadow:0 10px 24px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top, rgba(217,181,109,.12), transparent 34%),linear-gradient(180deg,#1a1410,#110f0d 70%);min-height:100vh}
button,input,select,textarea{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:10px}
.shell{background:linear-gradient(180deg,rgba(49,39,33,.98),rgba(29,23,19,.98));border:1px solid rgba(240,213,154,.14);border-radius:18px;box-shadow:var(--shadow);padding:12px;display:grid;gap:12px}
.compact-head{display:grid;gap:10px}
.brand-wrap{display:flex;align-items:center;min-width:0}
.brand-logo{display:block;width:100%;max-width:420px;height:auto;object-fit:contain}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
h1{font-size:1.42rem;line-height:1.05;color:var(--gold2);margin-bottom:4px}
.subtitle{color:var(--muted);font-size:.9rem}
.top-controls{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.control-block,.top-controls button{position:relative}
.config-arrow{position:absolute;top:-18px;left:0;display:none;color:#fff2cf;font-size:1rem;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.45);z-index:3;pointer-events:none;transition:left .18s ease}

.control-block{display:grid;gap:4px}
.compact-select{max-width:92px}
label{display:block;font-size:.74rem;color:var(--muted)}
select,button{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.08);padding:10px 12px;font-size:.95rem}
select{background:#171310;color:var(--text)}
button{cursor:pointer;background:linear-gradient(180deg,#d4b372,#bc9552);color:#231910;font-weight:800;transition:transform .12s ease, opacity .12s ease}
button:hover{transform:translateY(-1px)}
button:disabled{cursor:not-allowed;opacity:.45;transform:none}
button.ghost,button.secondary{background:#201914;color:var(--text);border-color:rgba(255,255,255,.12)}
.game-layout{display:grid;gap:12px}
.board-panel{display:grid;gap:10px;min-width:0}
.board-topbar{display:grid;gap:8px}
.info-line{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--gold2);border:1px solid rgba(255,255,255,.08)}
#winnerBox{font-weight:800;color:var(--gold2);font-size:.95rem;min-height:1.2em}
.board-wrapper{position:relative;background:url("images/bg.jpg") center/cover no-repeat;border-radius:16px;padding:10px 10px 14px;border:1px solid rgba(240,213,154,.12);overflow:hidden;min-height:542px;isolation:isolate}
.board-wrapper::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,16,12,.26),rgba(22,16,12,.36));pointer-events:none;z-index:0}
.board-actions{position:absolute;left:12px;top:12px;z-index:2;display:grid;gap:8px;justify-items:start;width:72px}
.move-counter{position:relative;left:auto;top:auto;width:72px;min-width:72px;height:72px;border-radius:14px;background:linear-gradient(180deg,#f4deb0,#d7b776);color:#281d12;font-weight:900;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:2;border:2px solid rgba(0,0,0,.08)}
.dice-subtag{font-size:.72rem;color:var(--gold2);min-height:1em;padding-left:4px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.board-roll-btn{width:72px;min-width:72px;padding:10px 8px;box-shadow:var(--shadow);font-size:.92rem;line-height:1.05;white-space:normal;word-break:break-word;text-align:center}
.move-counter.inactive{opacity:.55}
.move-counter.rolling{animation:diePulse .12s linear infinite; box-shadow:0 0 0 3px rgba(245,214,140,.15), 0 12px 30px rgba(0,0,0,.24)}
@keyframes diePulse{0%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.04) rotate(-4deg)}100%{transform:scale(1) rotate(4deg)}}
button:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.board-stage{position:relative;z-index:1;width:calc(var(--cell)*7);height:calc(var(--cell)*9);margin:96px auto 0;background:transparent;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.board-stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);background-size:var(--cell) var(--cell);pointer-events:none}
svg.edges{position:absolute;inset:0;overflow:visible}
.edge{stroke:rgba(240,223,187,.5);stroke-width:10;stroke-linecap:round}
.edge.main{stroke:rgba(255,231,180,.78);stroke-width:12}
.cell{position:absolute;width:36px;height:36px;border-radius:10px;transform:translate(-50%,-50%);background:#9b836b;border:2px solid rgba(255,255,255,.12);box-shadow:0 6px 10px rgba(0,0,0,.18)}
.cell.start{background:#7aa987}
.cell.finish{background:#be8c50}
.cell.current{box-shadow:0 0 0 4px rgba(244,222,176,.45), 0 0 18px rgba(244,222,176,.3)}
.cell::after{content:attr(data-symbol);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2c1d12;font-weight:900;font-size:.95rem}
.player-token{position:absolute;width:24px;height:24px;border-radius:999px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.94);box-shadow:0 4px 10px rgba(0,0,0,.35);transition:left .2s ease, top .2s ease}
.side-panel{display:grid;gap:10px}
.status-box,.controls-box,.message-log{background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px}
.dice{width:72px;height:72px;border-radius:16px;background:linear-gradient(180deg,#f4deb0,#d7b776);color:#281d12;font-weight:900;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.dice.rolling{animation:spin .18s linear infinite}
@keyframes spin{0%{transform:rotate(0)}50%{transform:rotate(8deg) scale(1.03)}100%{transform:rotate(0)}}
.dice-label{font-size:.88rem;color:var(--muted)}
.status-title{font-weight:800;color:var(--gold2);margin-bottom:8px;font-size:.94rem}
.players{display:grid;gap:8px}
.player-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent}
.player-card.active{border-color:rgba(240,213,154,.38);background:rgba(240,213,154,.08)}
.token-dot{width:14px;height:14px;border-radius:999px;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset}
.player-name{font-weight:700;font-size:.96rem}
.player-meta{font-size:.82rem;color:var(--muted)}
.controls-box{display:grid;gap:10px}
.start-confirm{width:100%;margin-top:4px}
.start-choice-arrow{position:absolute;transform:translate(-50%,-135%);font-size:1.05rem;font-weight:900;color:#fff2cf;text-shadow:0 2px 5px rgba(0,0,0,.55);pointer-events:none;z-index:3}
button.danger{background:linear-gradient(180deg,#b14242,#8f2626);color:#fff}
.controls-grid{width:156px;max-width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.controls-grid button{height:48px;padding:0;font-size:1.25rem}
.controls-grid .empty{visibility:hidden}
.invalid-hint{margin-top:2px;text-align:center;color:var(--danger);min-height:1.2em;font-size:.86rem}
.message-log p,.history-scroll p{margin:0 0 8px;color:var(--muted);font-size:.92rem;line-height:1.35}
.log-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.log-preview{min-height:72px}
.log-more{padding:7px 10px;font-size:.84rem;width:auto}
.history-modal{width:min(680px,100%)}
.history-scroll{max-height:14.5em;overflow:auto;padding-right:6px;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(10,8,7,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.overlay.show{display:flex}
.victory-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:30;background:radial-gradient(circle at center, rgba(123,85,25,.32), rgba(10,8,7,.92) 58%)}
.victory-overlay.show{display:flex}
.victory-card{width:min(92vw,720px);background:linear-gradient(180deg,rgba(44,31,21,.96),rgba(22,15,10,.98));border:1px solid rgba(244,222,176,.28);border-radius:24px;box-shadow:0 28px 70px rgba(0,0,0,.48);padding:28px 22px;text-align:center;overflow:hidden;position:relative}
.victory-card::before{content:"";position:absolute;inset:-20% -10%;background:conic-gradient(from 180deg, rgba(244,222,176,.0), rgba(244,222,176,.28), rgba(244,222,176,0), rgba(244,222,176,.18), rgba(244,222,176,0));filter:blur(14px);animation:victoryGlow 3s ease-in-out forwards;pointer-events:none}
.victory-kicker{position:relative;display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:6px 12px;border-radius:999px;background:rgba(244,222,176,.12);border:1px solid rgba(244,222,176,.18);color:var(--gold2);font-size:.84rem;letter-spacing:.04em;text-transform:uppercase;animation:victoryRise .8s ease both}
.victory-title{position:relative;margin:14px 0 8px;font-size:clamp(1.75rem,5.8vw,3rem);line-height:1.06;color:#fff2cf;text-shadow:0 6px 20px rgba(0,0,0,.28);animation:victoryRise 1.1s ease both}
.victory-text{position:relative;margin:0 auto 18px;max-width:26ch;font-size:clamp(1rem,3.6vw,1.25rem);color:var(--sand);animation:victoryRise 1.4s ease both}
.victory-burst{position:relative;height:74px;margin:10px 0 18px}
.victory-burst span{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:999px;background:rgba(244,222,176,.92);box-shadow:0 0 14px rgba(244,222,176,.65);animation:victorySpark 3s ease-out infinite;opacity:0}
.victory-burst span:nth-child(1){transform:rotate(0deg) translateY(-4px);animation-delay:.05s}
.victory-burst span:nth-child(2){transform:rotate(36deg) translateY(-4px);animation-delay:.18s}
.victory-burst span:nth-child(3){transform:rotate(72deg) translateY(-4px);animation-delay:.32s}
.victory-burst span:nth-child(4){transform:rotate(108deg) translateY(-4px);animation-delay:.46s}
.victory-burst span:nth-child(5){transform:rotate(144deg) translateY(-4px);animation-delay:.6s}
.victory-burst span:nth-child(6){transform:rotate(180deg) translateY(-4px);animation-delay:.74s}
.victory-burst span:nth-child(7){transform:rotate(216deg) translateY(-4px);animation-delay:.88s}
.victory-burst span:nth-child(8){transform:rotate(252deg) translateY(-4px);animation-delay:1.02s}
.victory-burst span:nth-child(9){transform:rotate(288deg) translateY(-4px);animation-delay:1.16s}
.victory-burst span:nth-child(10){transform:rotate(324deg) translateY(-4px);animation-delay:1.3s}
.victory-actions{position:relative;display:flex;justify-content:center;animation:victoryRise 1.7s ease both}
.victory-actions button{min-width:180px}
@keyframes victoryRise{0%{opacity:0;transform:translateY(18px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes victoryGlow{0%{opacity:0;transform:scale(.88) rotate(0deg)}30%{opacity:1}100%{opacity:.85;transform:scale(1.18) rotate(14deg)}}
@keyframes victorySpark{0%,15%{opacity:0;transform-origin:center center;translate:0 0;scale:.3}22%{opacity:1}65%{opacity:.9;translate:0 -34px;scale:1.35}100%{opacity:0;translate:0 -48px;scale:.5}}

.modal{width:min(640px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#342922,#251d18);border:1px solid rgba(240,213,154,.16);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.question-meta{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.options{display:grid;gap:8px;margin-top:12px}
.option{background:#201914;color:var(--text);text-align:left}
.option.correct{outline:2px solid var(--ok)}
.option.wrong{outline:2px solid var(--danger)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);min-height:60px}
.feedback.ok{border:1px solid rgba(123,196,140,.45)}
.feedback.bad{border:1px solid rgba(222,122,107,.45)}
.modal-actions{display:flex;justify-content:flex-end;margin-top:14px}
@media (min-width:900px){
  .app{padding:16px}
  .shell{padding:16px;gap:14px}
  .compact-head{grid-template-columns:minmax(240px,420px) minmax(0,1fr);align-items:center}
  .top-controls{grid-template-columns:92px 92px repeat(3,minmax(126px,1fr))}
  .game-layout{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .board-panel{min-width:0}
  .board-wrapper{min-height:560px;padding:14px}
  .board-actions{left:18px;top:18px;width:82px}
  .move-counter{width:82px;min-width:82px;height:82px;font-size:2.45rem}
  .board-roll-btn{width:82px;min-width:82px}
  .dice{width:82px;height:82px;font-size:2.2rem}
}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="compact-head">
      <div class="brand-wrap">
        <img src="images/logo.png" alt="Tarraco Romana" class="brand-logo" />
        <div class="sr-only">
          <h1 id="ui-title">Tarraco Romana</h1>
          <p id="ui-subtitle" class="subtitle">Demo 0.16 amb inici automàtic i configuració guiada.</p>
        </div>
      </div>
      <div class="top-controls" id="topControls">
        <div id="configArrow" class="config-arrow" aria-hidden="true">▼</div>
        <div class="control-block compact-select" id="playersControl">
          <label id="label-players" for="playerCountSelect">Jugadores</label>
          <select id="playerCountSelect">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
        <div class="control-block compact-select" id="languageControl">
          <label id="label-language" for="languageSelect">Idioma</label>
          <select id="languageSelect">
            <option value="">—</option>
            <option value="es">Castellano</option>
            <option value="en">English</option>
            <option value="ca">Català</option>
          </select>
        </div>
        <button id="newBoardBtn" class="secondary">Nuevo tablero</button>
        <button id="newGameBtn">Nueva partida</button>
        <button id="helpBtn" class="ghost">Cómo jugar</button>
      </div>
    </div>

    <div class="game-layout">
      <main class="board-panel">
        <div class="board-topbar"><div id="winnerBox"></div></div>

        <div id="boardWrapper" class="board-wrapper">
          <div class="board-actions">
            <div id="moveCounter" class="move-counter inactive">–</div>
            <button id="rollBtn" class="board-roll-btn">Tira<br>el dau</button>
          </div>
          <div id="boardStage" class="board-stage"></div>
        </div>
      </main>

      <aside class="side-panel">
        
        <div class="status-box">
          <div class="status-title" id="status-title">Estado de la partida</div>
          <div id="status-text"></div>
        </div>

        <div class="controls-box">
          <div class="status-title" id="move-title">Movimiento</div>
          <div class="controls-grid">
            <div class="empty"></div>
            <button id="upBtn" class="secondary">↑</button>
            <div class="empty"></div>
            <button id="leftBtn" class="secondary">←</button>
            <button id="downBtn" class="secondary">↓</button>
            <button id="rightBtn" class="secondary">→</button>
          </div>
          <div id="invalidHint" class="invalid-hint"></div>
          <button id="startConfirmBtn" class="start-confirm" style="display:none">OK</button>
        </div>

        <div class="status-box">
          <div class="status-title" id="players-title">Jugadores</div>
          <div id="playersList" class="players"></div>
        </div>

        <div class="message-log">
          <div class="log-header">
            <strong id="log-title">Crónica del Guardián</strong>
            <button id="viewMoreBtn" class="secondary log-more">Ver más</button>
          </div>
          <div id="logText" class="log-preview"></div>
        </div>
      </aside>
    </div>
  </div>
</div>

<div id="questionOverlay" class="overlay">
  <div class="modal">
    <h2 id="guardian-title">El Guardián del Pretorio pregunta</h2>
    <div id="questionMeta" class="question-meta"></div>
    <div id="questionText"></div>
    <div id="questionOptions" class="options"></div>
    <div id="feedback" class="feedback"></div>
    <div class="modal-actions">
      <button id="closeQuestionBtn" class="secondary" disabled>Cerrar</button>
    </div>
  </div>
</div>

<div id="helpOverlay" class="overlay">
  <div class="modal">
    <h2 id="help-title">Cómo jugar</h2>
    <div id="help-content"></div>
    <div class="modal-actions"><button id="closeHelpBtn">Entendido</button></div>
  </div>
</div>

<div id="historyOverlay" class="overlay">
  <div class="modal history-modal">
    <h2 id="history-title">Crónica completa del Guardián</h2>
    <div id="historyText" class="history-scroll"></div>
    <div class="modal-actions"><button id="closeHistoryBtn" class="secondary">Cerrar</button></div>
  </div>
</div>


<div id="victoryOverlay" class="victory-overlay">
  <div class="victory-card">
    <div class="victory-kicker" id="victoryKicker">Tàrraco Romana</div>
    <h2 id="victoryTitle" class="victory-title">El jugador 1 ha guanyat al Guardià!</h2>
    <p id="victoryText" class="victory-text">Enhorabona, ets lliure!</p>
    <div class="victory-burst" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="victory-actions"><button id="victoryNewGameBtn">Nova partida</button></div>
  </div>
</div>

<script>

  for(const a of state.board.active){ for(const b of (state.board.edges.get(a)||[])){ const id=[a,b].sort().join('|'); if(drawn.has(id)) continue; drawn.add(id); const A=parseKey(a), B=parseKey(b); const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',A.c*CELL+CELL/2); line.setAttribute('y1',A.r*CELL+CELL/2); line.setAttribute('x2',B.c*CELL+CELL/2); line.setAttribute('y2',B.r*CELL+CELL/2); line.setAttribute('class', (A.r<=2 || B.r<=2) ? 'edge main':'edge'); svg.appendChild(line);} }
  el.boardStage.appendChild(svg);
  for(const k of state.board.active){ const {r,c}=parseKey(k); const div=document.createElement('div'); const start=isStart(k); const finish=(k===state.board.finish); const current=state.started && state.players[state.currentPlayer]?.position===k; div.className=`cell ${start?'start':''} ${finish?'finish':''} ${current?'current':''}`; div.style.left=`${c*CELL+CELL/2}px`; div.style.top=`${r*CELL+CELL/2}px`; div.dataset.symbol = finish ? '★' : (start ? '▲' : ''); el.boardStage.appendChild(div);} 
  state.players.filter(p=>p.position).forEach((p)=>{ const {r,c}=parseKey(p.position); const token=document.createElement('div'); token.id=`token-${p.id}`; token.className='player-token'; token.style.background=p.color; const stack = state.players.filter(x=>x.position===p.position); const idx=stack.findIndex(x=>x.id===p.id); const offsets=[[0,-10],[-10,8],[10,8]]; const off=offsets[idx]||[0,0]; token.style.left=`${c*CELL+CELL/2+off[0]}px`; token.style.top=`${r*CELL+CELL/2+off[1]}px`; el.boardStage.appendChild(token); });
}
function renderPlayers(){ el.playersList.innerHTML=''; state.players.forEach((p,i)=>{ const activeTurn = state.started && i===state.currentPlayer && !state.gameOver; const card=document.createElement('div'); card.className=`player-card ${activeTurn?'active':''}`; const posText = p.position ? ' · '+t('startCell')+': '+(state.board.starts.indexOf(p.position)+1) : ''; card.innerHTML=`<div class="token-dot" style="background:${p.color}"></div><div><div class="player-name">${p.name}</div><div class="player-meta">${p.status}${posText}</div></div><div class="player-meta">${activeTurn?'▶':''}</div>`; el.playersList.appendChild(card); }); }
function renderStatus(){
  if(!state.started){
    el.statusText.innerHTML=`<div class="setup-hint">${getSetupGuide()}</div>`;
    el.invalidHint.textContent='';
    renderMoveCounter();
    updateSetupButtons();
    return;
  }
  const p=state.players[state.currentPlayer];
  if(state.selectingStarts){
    el.statusText.innerHTML=`<strong>${t('selectingStart')}:</strong><br><span class="player-meta">${t('startSelectionHelp')}</span>`;
    renderMoveCounter();
    updateSetupButtons();
    return;
  }
  el.statusText.innerHTML=`<strong>${t('currentTurn')}:</strong> ${p.name}<br><strong>${t('diceLabel')}:</strong> ${state.lastDie ?? '–'}`;
  renderMoveCounter();
  updateSetupButtons();
}

function renderMoveCounter(){
  if(!el.moveCounter) return;
  const active=state.started && (state.moveMode || state.movementRemaining>0) && !state.asking && !state.gameOver;
  el.moveCounter.textContent = active ? String(state.movementRemaining) : '–';
  el.moveCounter.classList.toggle('inactive', !active);
  el.moveCounter.classList.toggle('small', active && state.movementRemaining >= 10);
  const current = state.players[state.currentPlayer];
  if(active && current){ el.moveCounter.style.background = current.color; el.moveCounter.style.color = '#ffffff'; }
  else { el.moveCounter.style.background=''; el.moveCounter.style.color=''; }
}
function getSetupGuide(){
  const done='✅'; const wait='⬜';
  const p1 = state.setup.playersChosen ? done : wait;
  const p2 = state.setup.languageChosen ? done : wait;
  const p3 = state.setup.boardChosen ? done : wait;
  const ready = state.setup.playersChosen && state.setup.languageChosen && state.setup.boardChosen;
  return `<strong>${t('setupTitle')}</strong><br>${p1} 1) ${t('setupPlayers')}<br>${p2} 2) ${t('setupLanguage')}<br>${p3} 3) ${t('setupBoard')}<br>${ready? '✅ 4) '+t('setupNewGameReady') : '⬜ 4) '+t('setupNewGame')}`;
}
function updateSetupButtons(){
  const locked = state.started;
  el.playerCountSelect.disabled = locked;
  el.languageSelect.disabled = locked;
  el.newBoardBtn.disabled = locked || !(state.setup.playersChosen && state.setup.languageChosen);
  el.newGameBtn.disabled = !locked && !(state.setup.playersChosen && state.setup.languageChosen && state.setup.boardChosen);
  el.newGameBtn.classList.toggle('danger', locked);
  el.newGameBtn.classList.remove('secondary');
  el.newGameBtn.textContent = locked ? t('abandonGame') : t('newGame');
  el.startConfirmBtn.style.display = state.selectingStarts ? 'block' : 'none';
  el.startConfirmBtn.disabled = !state.selectingStarts;
  updateConfigArrow();
}
function updateConfigArrow(){
  if(!el.configArrow || state.started){ el.configArrow && (el.configArrow.style.display='none'); return; }
  let target = null;
  if(!state.setup.playersChosen) target = document.getElementById('playersControl');
  else if(!state.setup.languageChosen) target = document.getElementById('languageControl');
  else if(!state.setup.boardChosen) target = el.newBoardBtn;
  else target = el.newGameBtn;
  if(!target){ el.configArrow.style.display='none'; return; }
  const topRect = el.topControls.getBoundingClientRect();
  const rect = target.getBoundingClientRect();
  el.configArrow.style.display='block';
  el.configArrow.style.left = `${rect.left - topRect.left + rect.width/2 - 6}px`;
}
function updateMoveButtons(){ if(state.selectingStarts){ el.leftBtn.disabled=true; el.rightBtn.disabled=true; el.upBtn.disabled=true; el.downBtn.disabled=true; return; } const enabled=state.moveMode && !state.busy && !state.asking && !state.gameOver; ['up','down','left','right'].forEach(dir=>{ el[dir+'Btn'].disabled=!enabled; }); }
function updateUIStrings(){ document.documentElement.lang=state.lang; document.title='0.16'; document.getElementById('ui-title').textContent=t('title'); document.getElementById('ui-subtitle').textContent=t('subtitle'); document.getElementById('label-language').textContent=t('language'); document.getElementById('label-players').textContent=t('players'); document.getElementById('status-title').textContent=t('statusTitle'); document.getElementById('players-title').textContent=t('playersTitle'); document.getElementById('move-title').textContent=t('moveTitle'); document.getElementById('log-title').textContent=t('logTitle'); el.historyTitle.textContent=t('historyTitle'); el.viewMoreBtn.textContent=t('viewMore'); el.guardianTitle.textContent=t('guardianTitle'); document.getElementById('help-title').textContent=t('helpTitle'); el.helpContent.innerHTML=t('helpContent'); el.newBoardBtn.textContent=t('newBoard'); el.rollBtn.innerHTML=t('roll'); el.helpBtn.textContent=t('howToPlay'); el.startConfirmBtn.textContent='OK'; el.closeQuestionBtn.textContent=t('close'); el.closeHelpBtn.textContent=t('understood'); el.closeHistoryBtn.textContent=t('close'); el.victoryKicker.textContent=t('victoryKicker'); el.victoryNewGameBtn.textContent=t('newGame'); renderPlayers(); renderStatus(); renderBoard(); renderLog(); updateSetupButtons(); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function showVictory(player){
  el.victoryTitle.textContent=t('victoryWinMessage').replace('{player}', player.name);
  el.victoryText.textContent=t('victoryFreedom');
  el.victoryOverlay.classList.remove('show');
  void el.victoryOverlay.offsetWidth;
  el.victoryOverlay.classList.add('show');
}
function hideVictory(){ el.victoryOverlay.classList.remove('show'); }
function clearQuestionHUD(){ el.questionOverlay.classList.remove('show'); el.feedback.className='feedback'; el.feedback.innerHTML=''; el.questionMeta.textContent=''; el.questionText.innerHTML=''; el.questionOptions.innerHTML=''; el.closeQuestionBtn.disabled=true; el.helpOverlay.classList.remove('show'); el.historyOverlay.classList.remove('show'); }
function assignRandomStarts(){
  const starts = shuffle([...state.board.starts]);
  state.players.forEach((p,i)=>{ p.position = starts[i] || starts[0]; p.status = t('waitingQuestion'); });
  state.selectingStarts=false;
  state.currentPlayer=0;
  el.rollBtn.disabled=false;
  renderBoard(); renderPlayers(); renderStatus(); updateSetupButtons(); updateMoveButtons();
}
function renderLog(){ const entries = state.logEntries || []; el.logText.innerHTML = entries.slice(0,3).map(msg=>`<p>${escapeHtml(msg)}</p>`).join(''); el.historyText.innerHTML = entries.map(msg=>`<p>${escapeHtml(msg)}</p>`).join(''); el.viewMoreBtn.style.display = entries.length>3 ? 'inline-flex' : 'none'; }
function log(msg){ state.logEntries.unshift(msg); renderLog(); }
async function animateDie(max=6){ const result=dieRoll(max); el.moveCounter.classList.remove('inactive'); el.moveCounter.classList.add('rolling'); const start=performance.now(); while(performance.now()-start<1000){ el.moveCounter.textContent=String(dieRoll(max)); await delay(90); } el.moveCounter.classList.remove('rolling'); el.moveCounter.textContent=String(result); state.lastDie=result; renderStatus(); return result; }
async function animateTokenTo(player, pos){ player.position=pos; renderBoard(); renderPlayers(); renderStatus(); await delay(220); }
async function handleMove(dir){
  if(!state.moveMode || state.busy || state.asking || state.gameOver || state.selectingStarts) return;
  const player=state.players[state.currentPlayer]; const cur=parseKey(player.position); const d=dirs[dir]; const next=key(cur.r+d[0], cur.c+d[1]);
  el.invalidHint.textContent='';
  if(!state.board.active.has(next) || !(state.board.edges.get(player.position)||new Set()).has(next)){ el.invalidHint.textContent=t('invalidMove'); return; }
  state.busy=true; await animateTokenTo(player,next); state.movementRemaining=Math.max(0,state.movementRemaining-1); state.busy=false; renderStatus();
  if(player.position===state.board.finish){
    state.moveMode=false; updateMoveButtons(); log(`${player.name}: ${t('finalPromptMeta')}`); await delay(180); askQuestion(player, true); return;
  }
  if(state.movementRemaining<=0){ state.moveMode=false; updateMoveButtons(); log(`${player.name}: ${t('moveConsumed')}`); await delay(180); askQuestion(player, false); }
}
function hasAnyMoves(pos){ return getNeighbors(pos).length>0; }
async function executeRoll(){
  if(!state.started){ log(t('launchFirst')); return; }
  if(state.selectingStarts){ return; }
  if(state.asking || state.busy || state.moveMode || state.gameOver){ log(t('rollDisabledQuestion')); return; }
  const player=state.players[state.currentPlayer]; if(!hasAnyMoves(player.position)){ log(t('cannotMove')); return; }
  state.busy=true; el.rollBtn.disabled=true; el.invalidHint.textContent=''; const die=await animateDie(6); state.movementRemaining=die; player.status=t('movementReady'); state.moveMode=true; state.busy=false; renderPlayers(); renderStatus(); updateMoveButtons(); log(`${player.name}: ${t('moveWithArrows')} (${die})`); }
function askQuestion(player, finalOnly=false){ state.asking=true; state.awaitingFinal=finalOnly; const q=getQuestion(finalOnly); state.currentQuestion=q; const loc=localizeQuestion(q); el.questionMeta.textContent=`${finalOnly?t('finalPromptMeta'):t('normalPromptMeta')} · ${t('questionNumber')} ${q.number}`; el.questionText.innerHTML=`<p><strong>${loc.question}</strong></p><p class="question-meta">${t('category')}: ${t(q.category)} · ${t('difficulty')}: ${t(q.difficulty)}</p>`; el.questionOptions.innerHTML=''; el.feedback.className='feedback'; el.feedback.innerHTML=''; el.closeQuestionBtn.disabled=true;
  ['A','B','C','D'].forEach(letter=>{ const btn=document.createElement('button'); btn.className='option'; btn.innerHTML=`<strong>${letter}.</strong> ${loc.options[letter]}`; btn.addEventListener('click',()=>answerQuestion(letter)); el.questionOptions.appendChild(btn); });
  el.questionOverlay.classList.add('show'); log(t('questionAfterMove')); }
async function answerQuestion(letter){ if(!state.asking || state.busy) return; state.busy=true; const q=state.currentQuestion; const loc=localizeQuestion(q); const buttons=[...el.questionOptions.querySelectorAll('button')]; buttons.forEach(btn=>btn.disabled=true); buttons.forEach(btn=>{ const bLetter=btn.textContent.trim()[0]; if(bLetter===q.correct_answer) btn.classList.add('correct'); if(bLetter===letter && letter!==q.correct_answer) btn.classList.add('wrong'); });
  const correct=(letter===q.correct_answer); const player=state.players[state.currentPlayer]; state.lastAnswerCorrect=correct;
  if(correct){ el.feedback.className='feedback ok'; el.feedback.innerHTML=`<strong>${t('correct')}</strong><br>${loc.explanation}`; player.status=t('correct'); state.pendingRetreat=null; if(state.awaitingFinal && player.position===state.board.finish){ state.gameOver=true; el.winnerBox.textContent=`${player.name} ${t('won')}`; log(`${player.name} ${t('won')}`); showVictory(player); } }
  else { el.feedback.className='feedback bad'; el.feedback.innerHTML=`<strong>${t('incorrect')}</strong><br>${loc.explanation}`; player.status=t('incorrect'); state.pendingRetreat={playerId:player.id,max:3}; }
  el.closeQuestionBtn.disabled=false; state.busy=false; renderPlayers(); renderStatus(); }
async function retreatPlayer(player, steps){ state.retreatMode=true; let current=player.position; const path=shortestPath(current, state.board.starts).slice(0, steps); for(const next of path){ await animateTokenTo(player,next); current=next; } log(`${player.name}: ${t('retreating')} ${path.length}`); state.retreatMode=false; }
async function closeQuestion(){ if(state.busy) return; const pendingRetreat=state.pendingRetreat ? {...state.pendingRetreat} : null; el.questionOverlay.classList.remove('show'); state.asking=false; state.awaitingFinal=false; state.currentQuestion=null; renderPlayers(); renderStatus(); updateMoveButtons();
  if(!state.gameOver && pendingRetreat){
    const player=state.players.find(p=>p.id===pendingRetreat.playerId);
    if(player){
      state.busy=true; el.rollBtn.disabled=true; log(`${player.name}: ${t('retreatRoll')}`); const retreat=await animateDie(3); await retreatPlayer(player, retreat); state.busy=false;
    }
    state.pendingRetreat=null;
  }
  if(!state.gameOver){ nextTurn(); } else { el.rollBtn.disabled=true; }
  renderPlayers(); renderStatus(); updateMoveButtons(); }
function nextTurn(){ state.currentPlayer=(state.currentPlayer+1)%state.players.length; state.players.forEach((p,i)=>{ p.status = i===state.currentPlayer ? t('waitingQuestion') : t('waitingQuestion'); }); state.lastDie=null; state.movementRemaining=0; state.moveMode=false; el.rollBtn.disabled=false; renderPlayers(); renderStatus(); updateMoveButtons(); updateSetupButtons(); }
function setupPlayers(){ const count=Number(el.playerCountSelect.value); state.players = Array.from({length:count},(_,i)=>({id:i+1,name:`${t('player')} ${i+1}`,color:PLAYER_COLORS[i],position:null,status:t('chooseStart')})); state.currentPlayer=0; }
function resetStateForGame(){ hideVictory(); clearQuestionHUD(); state.started=true; state.gameOver=false; state.asking=false; state.busy=false; state.awaitingFinal=false; state.currentQuestion=null; state.lastDie=null; state.movementRemaining=0; state.moveMode=false; state.retreatMode=false; state.pendingRetreat=null; state.lastAnswerCorrect=null; state.selectingStarts=false; state.startChoiceIndex=0; state.startSelectPlayer=0; el.invalidHint.textContent=''; el.winnerBox.textContent=''; el.rollBtn.disabled=true; }
function startNewGame(){ if(!state.setup.boardChosen){ renderStatus(); return; } resetQuestions(); setupPlayers(); resetStateForGame(); state.logEntries=[]; renderLog(); renderBoard(); renderPlayers(); assignRandomStarts(); log(t('newGameReady')); }
function regenerateBoard(){ hideVictory(); clearQuestionHUD(); state.board=makeBoard(); state.setup.boardChosen=true; if(state.started) setupPlayers(); state.lastDie=null; state.movementRemaining=0; state.moveMode=false; state.busy=false; state.asking=false; state.gameOver=false; state.pendingRetreat=null; state.lastAnswerCorrect=null; state.logEntries=[]; state.selectingStarts=false; el.invalidHint.textContent=''; el.winnerBox.textContent=''; renderBoard(); renderPlayers(); renderStatus(); updateMoveButtons(); updateSetupButtons(); log(t('randomBoardReady')); }

el.languageSelect.addEventListener('change',e=>{ state.lang=e.target.value || 'es'; state.setup.languageChosen=!!e.target.value; updateUIStrings(); updateSetupButtons(); renderStatus(); });
el.newGameBtn.addEventListener('click',()=>{ if(state.started){ window.location.reload(); return; } if(!state.setup.boardChosen){ renderStatus(); return; } startNewGame(); });
el.playerCountSelect.addEventListener('change',()=>{ state.setup.playersChosen=Number(el.playerCountSelect.value)>0; state.setup.boardChosen=false; state.board=makeBoard(); updateSetupButtons(); renderBoard(); renderStatus(); });
el.newBoardBtn.addEventListener('click',()=>{ if(!state.setup.playersChosen || !state.setup.languageChosen){ renderStatus(); return; } regenerateBoard(); updateSetupButtons(); });
el.rollBtn.addEventListener('click',executeRoll);
el.helpBtn.addEventListener('click',()=>el.helpOverlay.classList.add('show'));
el.closeHelpBtn.addEventListener('click',()=>el.helpOverlay.classList.remove('show'));
el.viewMoreBtn.addEventListener('click',()=>el.historyOverlay.classList.add('show'));
el.closeHistoryBtn.addEventListener('click',()=>el.historyOverlay.classList.remove('show'));
el.victoryNewGameBtn.addEventListener('click',()=>{ hideVictory(); clearQuestionHUD(); startNewGame(); });
el.historyOverlay.addEventListener('click',e=>{ if(e.target===el.historyOverlay) el.historyOverlay.classList.remove('show'); });
window.addEventListener('resize',()=>{ updateResponsiveBoardScale(); updateConfigArrow(); });
el.closeQuestionBtn.addEventListener('click',closeQuestion);
el.questionOverlay.addEventListener('click',e=>{ if(e.target===el.questionOverlay && !el.closeQuestionBtn.disabled && !state.busy) closeQuestion(); });
[['upBtn','up'],['downBtn','down'],['leftBtn','left'],['rightBtn','right']].forEach(([id,dir])=>el[id].addEventListener('click',()=>handleMove(dir)));
window.addEventListener('keydown',e=>{ const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}; if(map[e.key]){ e.preventDefault(); handleMove(map[e.key]); } });

state.lang='es'; state.board=makeBoard(); resetQuestions(); clearQuestionHUD(); updateUIStrings(); renderBoard(); renderPlayers(); renderStatus(); updateMoveButtons(); updateSetupButtons(); renderLog(); log(t('waitingStart'));
</script>
</body>
